<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditní trenažér IIA</title>
<meta name="description" content="Příprava na zkoušky interního auditu podle Globálních standardů IIA 2024 — otázky, opakování chyb a sledování pokroku.">
<meta name="theme-color" content="#0B6E6E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<!--APP-->
<header class="topbar">
  <div class="brandmark" aria-hidden="true">IA</div>
  <div class="lvl">
    <div class="lvl-row">
      <span class="lvl-name" id="lvlName">Kandidát</span>
      <span class="lvl-xp" id="lvlXp">0 XP</span>
    </div>
    <div class="xpbar"><i id="xpFill" style="width:0%"></i></div>
  </div>
  <div class="flame" id="streak">0</div>
  <button class="langbtn" id="btnLang">EN</button>
</header>

<main>
  <!-- DOMŮ -->
  <section class="screen wrap" id="s-home">
    <div class="today">
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84" aria-hidden="true">
          <circle cx="42" cy="42" r="36" fill="none" stroke="var(--surface-3)" stroke-width="8"></circle>
          <circle id="ringFill" cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="8"
                  stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="226"></circle>
        </svg>
        <div class="val"><div><b id="ringNum">0</b><span id="ringDen">/10</span></div></div>
      </div>
      <div class="today-txt">
        <h2 id="todayTitle"></h2>
        <p id="todayText"></p>
      </div>
    </div>

    <div class="sec">
      <div class="modes">
        <button class="mode primary" data-go="daily">
          <span class="m-ico">▶</span>
          <span class="m-txt"><span class="m-name" data-t="m_daily"></span><span class="m-sub" data-t="m_daily_sub"></span></span>
          <span class="m-count" id="cDaily"></span>
        </button>
        <button class="mode" data-go="mistakes">
          <span class="m-ico">↺</span>
          <span class="m-txt"><span class="m-name" data-t="m_mist"></span><span class="m-sub" data-t="m_mist_sub"></span></span>
          <span class="m-count" id="cMist"></span>
        </button>
        <button class="mode" data-go="open">
          <span class="m-ico">✎</span>
          <span class="m-txt"><span class="m-name" data-t="m_open"></span><span class="m-sub" data-t="m_open_sub"></span></span>
          <span class="m-count" id="cOpen"></span>
        </button>
      </div>
    </div>

    <div class="sec" id="weakSec" hidden>
      <div class="sec-h"><h2 data-t="h_weak"></h2><span class="hint" data-t="h_mastery"></span></div>
      <div class="weak" id="weakList"></div>
    </div>

    <div class="sec">
      <div class="sec-h"><h2 data-t="h_total"></h2><span class="hint" id="totSeen"></span></div>
      <div class="tiles">
        <div class="tile ok"><b id="tOk">0</b><span data-t="t_ok"></span></div>
        <div class="tile warn"><b id="tPart">0</b><span data-t="t_part"></span></div>
        <div class="tile bad"><b id="tBad">0</b><span data-t="t_bad"></span></div>
      </div>
    </div>
  </section>

  <!-- TRÉNINK -->
  <section class="screen wrap" id="s-train" hidden>
    <p class="eyebrow" data-t="eyebrow_train"></p>
    <div class="sec-h"><h2 data-t="h_areas"></h2><span class="hint" data-t="h_mastery"></span></div>
    <button class="mode" data-go="all" style="margin-bottom:6px">
      <span class="m-ico">∑</span>
      <span class="m-txt"><span class="m-name" data-t="m_all"></span><span class="m-sub" data-t="m_all_sub"></span></span>
      <span class="m-count" id="cAll"></span>
    </button>
    <div id="areaList"></div>
  </section>

  <!-- POKROK -->
  <section class="screen wrap" id="s-prog" hidden>
    <p class="eyebrow" data-t="eyebrow_prog"></p>
    <div class="sec-h"><h2 data-t="h_domains"></h2><span class="hint" data-t="h_byrep"></span></div>
    <div class="areas" id="domProg"></div>

    <div class="sec">
      <div class="sec-h"><h2 data-t="h_activity"></h2><span class="hint" data-t="h_14days"></span></div>
      <div class="weak" id="actList"></div>
    </div>

  </section>

  <!-- ODZNAKY -->
  <section class="screen wrap" id="s-badges" hidden>
    <p class="eyebrow" data-t="eyebrow_badges"></p>
    <div class="sec-h"><h2 data-t="h_badges"></h2><span class="hint" id="badgeCount"></span></div>
    <div class="badges" id="badgeList"></div>
  </section>

  <!-- NASTAVENÍ -->
  <section class="screen wrap" id="s-set" hidden>
    <p class="eyebrow" data-t="eyebrow_set"></p>
    <div class="sec-h"><h2 data-t="h_set"></h2></div>

    <div class="field">
      <span class="flabel" data-t="h_lang"></span>
      <div class="seg" id="segLang">
        <button data-lang="cs">Čeština</button>
        <button data-lang="en">English</button>
      </div>
    </div>

    <div class="field">
      <span class="flabel" data-t="h_look"></span>
      <div class="seg" id="segTheme">
        <button data-theme="" data-t="th_sys"></button>
        <button data-theme="light" data-t="th_light"></button>
        <button data-theme="dark" data-t="th_dark"></button>
      </div>
    </div>

    <div class="field">
      <span class="flabel" data-t="h_goal"></span>
      <div class="seg" id="segGoal">
        <button data-goal="5">5</button>
        <button data-goal="10">10</button>
        <button data-goal="15">15</button>
        <button data-goal="20">20</button>
      </div>
      <p class="note" data-t="goal_note" style="margin-top:8px"></p>
    </div>

    <div class="sec">
      <div class="sec-h"><h2 data-t="h_remind"></h2></div>
      <div class="remind">
        <label for="remFreq"><span data-t="r_freq"></span>
          <select id="remFreq">
            <option value="1"></option>
            <option value="2"></option>
            <option value="3" selected></option>
            <option value="7"></option>
          </select>
        </label>
        <label for="remTime"><span data-t="r_time"></span>
          <input type="time" id="remTime" value="19:00">
        </label>
      </div>
      <button class="btn" id="btnGCal" data-t="r_gcal"></button>
      <button class="btn ghost" id="btnIcs" data-t="r_ics"></button>
      <p class="note" id="remNote"></p>
    </div>

    <div class="sec">
      <div class="sec-h"><h2 data-t="h_data"></h2></div>
      <div class="rowbtns">
        <button class="btn ghost" id="btnExport" data-t="b_export"></button>
        <button class="btn ghost" id="btnImport" data-t="b_import"></button>
      </div>
      <button class="btn ghost" id="btnReset" style="color:var(--bad)" data-t="b_reset"></button>
      <input type="file" id="fileIn" accept="application/json" hidden>
    </div>
    <p class="note" id="aboutNote"></p>
  </section>

  <!-- KVÍZ -->
  <section class="screen wrap" id="s-quiz" hidden>
    <div class="qhead">
      <button class="x" id="quizExit" data-t-aria="q_exit">✕</button>
      <div class="qprog"><i id="qFill" style="width:0%"></i></div>
      <span class="qcount" id="qCount">1/10</span>
      <span class="combo" id="qCombo" hidden></span>
    </div>
    <div id="quizBody"></div>
  </section>
</main>

<nav class="tabbar">
  <button class="tab" data-tab="home" aria-current="true">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg><span data-t="tab_home"></span></button>
  <button class="tab" data-tab="train">
    <svg viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h10"/></svg><span data-t="tab_train"></span></button>
  <button class="tab" data-tab="prog">
    <svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg><span data-t="tab_prog"></span></button>
  <button class="tab" data-tab="badges">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="6"/><path d="M8.5 14 7 22l5-3 5 3-1.5-8"/></svg><span data-t="tab_badges"></span></button>
  <button class="tab" data-tab="set">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5v.1a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H2a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H8a1.6 1.6 0 0 0 1-1.5V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V8a1.6 1.6 0 0 0 1.5 1h.1a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg><span data-t="tab_set"></span></button>
</nav>
<!--/APP-->

<script src="assets/i18n.js"></script>
<script src="assets/questions.cs.js"></script>
<script src="assets/questions.en.js"></script>
<script src="assets/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js").catch(function () {});
  });
}
</script>
</body>
</html>
